# LiteLLM proxy config — AgentLedger budget guardrail
#
# The guardrail checks each call against an AgentLedger budget BEFORE the
# provider is charged, then records the real cost after. Same agent_id can
# also spend on x402/MPP/manual rails against the same cap.

model_list:
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

guardrails:
  - guardrail_name: agentledger-budget
    litellm_params:
      guardrail: custom_guardrail   # loads the CustomGuardrail subclass below
      mode: [pre_call, post_call]   # check before; record after
      default_on: true

# Register the class (one of):
#   litellm_settings:
#     custom_provider_map:
#       - {provider: agentledger, custom_handler: integrations.litellm.agentledger_guardrail.AgentLedgerBudgetGuardrail}
#
# env:
#   AGENTLEDGER_API_BASE      https://aiagentscity.com/mcp/   (default)
#   AGENTLEDGER_WORKSPACE_KEY wk_live_...                     (from ledger_start)
#   AGENTLEDGER_AGENT_SECRET  ags_...                         (per agent)
#   AGENTLEDGER_AGENT_ID      optional default agent id
#   AGENTLEDGER_BLOCK_ON_ERROR=1  fail closed if the ledger is unreachable
#
# Map LiteLLM identity -> agent_id (pick one):
#   metadata.agentledger_agent_id on the virtual key/team   (most explicit)
#   user_api_key_alias / user_api_key_user_id / team id     (automatic)
#
# Per-key budget tags — on the virtual key:
#   metadata: { "agentledger_agent_id": "agent-coder-1" }
# On the team:
#   metadata: { "agentledger_agent_id": "team-platform" }
